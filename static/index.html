<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Read · 英语阅读</title><link rel="stylesheet" href="/static/reader.css?v=sentence-close-reading-v2"><script src="/static/auth.js?v=sentence-close-reading-v2" defer></script><script src="/static/app.js?v=sentence-close-reading-v2" defer></script></head><body>
<header class="top"><a class="brand" href="#">Read <small>慢读，常听。</small></a><nav><a href="#">文章库</a><a href="#sentences">句子本</a><button id="settingsBtn">设置</button></nav></header><main id="main"></main><p id="notice" role="status"></p>
<section id="dock" hidden aria-label="原版音频"><div><strong id="audioTitle">原版音频</strong><small id="audioHint"></small><small id="syncStatus">正在读取句子时间轴…</small></div><audio id="audio" controls preload="metadata"></audio><label>语速 <select id="rate"><option value="0.5">0.5×</option><option value="0.6">0.6×</option><option value="0.7">0.7×</option><option value="0.75">0.75×</option><option value="0.8">0.8×</option><option value="0.9">0.9×</option><option value="1" selected>1×</option><option value="1.1">1.1×</option><option value="1.2">1.2×</option><option value="1.25">1.25×</option><option value="1.3">1.3×</option><option value="1.4">1.4×</option><option value="1.5">1.5×</option><option value="1.75">1.75×</option><option value="2">2×</option></select></label></section>
<dialog id="translation"><form method="dialog"><button class="close" aria-label="关闭句子解析">×</button></form><small>AI 句子精读</small><p id="selectedSentence" lang="en"></p><p id="analysisStatus" aria-live="polite"></p><div id="analysisResult" hidden><section class="analysis-section"><h3>参考译文</h3><p id="translated"></p></section><section class="analysis-section"><h3>句子主干</h3><p id="sentenceStructure"></p></section><section class="analysis-section"><h3>长难句拆分</h3><ol id="clauseAnalysis" class="analysis-list"></ol></section><section class="analysis-section"><h3>语法解析</h3><ul id="grammarAnalysis" class="analysis-list"></ul></section></div><button id="saveSentence" class="primary" disabled>收藏到句子本</button></dialog>
<dialog id="settings"><form method="dialog"><button class="close" aria-label="关闭设置">×</button></form><h2>阅读设置</h2><label>正文字号<select id="fontSize"><option value="19">标准</option><option value="22">大</option><option value="25">特大</option></select></label><form id="aiSettings"><h3>AI 句子精读</h3><label>服务商<select id="provider"><option value="deepseek">DeepSeek</option><option value="qwen">通义千问</option></select></label><label>API Key<input id="apiKey" type="password" autocomplete="new-password" placeholder="留空保留已有密钥"></label><label>模型<input id="model" required></label><label>服务地址<input id="baseUrl" type="url" required></label><p id="configured"></p><details class="advanced-settings"><summary>原版音频逐句高亮设置</summary><p>首次生成时间轴需要通义听写和阿里云 OSS；已生成的文章会直接使用缓存。</p><label>通义 API Key<input id="asrKey" type="password" autocomplete="new-password" placeholder="留空保留已有密钥"></label><label>听写模型<input id="asrModel"></label><label>听写服务地址<input id="asrBaseUrl" type="url"></label><label>OSS Access Key ID<input id="ossKeyId" autocomplete="off" placeholder="留空保留已有配置"></label><label>OSS Access Key Secret<input id="ossKeySecret" type="password" autocomplete="new-password" placeholder="留空保留已有密钥"></label><label>OSS Bucket<input id="ossBucket"></label><label>OSS Endpoint<input id="ossEndpoint" placeholder="例如 oss-cn-shanghai.aliyuncs.com"></label><p id="alignmentConfigured"></p></details><button class="primary">保存设置</button></form><hr><p><a href="/media">管理原版音频与文章配对 →</a></p><p><a href="/media#external-access">在 foobar2000 等外部播放器中收听 →</a></p><button id="logout">退出登录</button></dialog>
<dialog id="import"><form method="dialog"><button class="close" aria-label="关闭导入">×</button></form><h2>导入阅读材料</h2><form id="importForm"><label>文章 · EPUB / DOCX / TXT<input id="articleFile" type="file" accept=".epub,.docx,.txt" required></label><label>配套音频 ZIP（可选，仅搭配 EPUB）<input id="audioFile" type="file" accept=".zip"></label><p>导入后可在音频管理页检查文章与音频配对。</p><button class="primary">开始导入</button></form><p id="importStatus" role="status"></p></dialog></body></html>
