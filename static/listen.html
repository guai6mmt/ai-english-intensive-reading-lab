<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0f1115" />
    <title>听力模式 · English Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/listen.css?v=20260520-listen" />
  </head>
  <body>
    <div class="lp" id="lpRoot" data-state="loading">
      <!-- Top bar -->
      <header class="lp-top">
        <button class="lp-icon" id="lpBackBtn" aria-label="返回">←</button>
        <div class="lp-title-wrap">
          <div class="lp-title" id="lpTitle">加载中…</div>
          <div class="lp-sub" id="lpSub"></div>
        </div>
        <button class="lp-icon" id="lpThemeBtn" aria-label="切换主题" title="切换主题">◐</button>
        <button class="lp-icon" id="lpFullscreenBtn" aria-label="全屏" title="全屏">⛶</button>
      </header>

      <!-- Loading state -->
      <section class="lp-loading" id="lpLoading">
        <div class="lp-spinner"></div>
        <div class="lp-loading-text" id="lpLoadingText">正在准备文章…</div>
        <div class="lp-loading-hint">首次进入需要分析全文句子，约需 10-30 秒</div>
      </section>

      <!-- Ready / playing state -->
      <section class="lp-main" id="lpMain" hidden>
        <div class="lp-article" id="lpArticle"></div>
        <div class="lp-vocab" id="lpVocab">
          <div class="lp-vocab-head">当前句生词</div>
          <div class="lp-vocab-body" id="lpVocabBody">
            <div class="lp-vocab-empty">点击开始后将显示当前句的生词与释义</div>
          </div>
        </div>
      </section>

      <!-- Start overlay -->
      <div class="lp-start-overlay" id="lpStartOverlay" hidden>
        <button class="lp-start-btn" id="lpStartBtn" aria-label="开始播放">
          <span class="lp-start-ic">▶</span>
          <span class="lp-start-text" id="lpStartText">开始播放</span>
        </button>
        <div class="lp-start-sub" id="lpStartSub"></div>
      </div>

      <!-- Bottom control bar -->
      <footer class="lp-controls" id="lpControls" hidden>
        <div class="lp-progress-wrap">
          <div class="lp-progress-bar" id="lpProgressBar">
            <div class="lp-progress-fill" id="lpProgressFill"></div>
          </div>
          <div class="lp-progress-meta">
            <span id="lpProgressIndex">0</span>
            <span class="lp-progress-sep">/</span>
            <span id="lpProgressTotal">0</span>
          </div>
        </div>
        <div class="lp-ctrl-row">
          <button class="lp-ctrl" id="lpPrevBtn" aria-label="上一句" title="上一句">⏮</button>
          <button class="lp-ctrl" id="lpRepeatBtn" aria-label="复读" title="复读当前句">↺</button>
          <button class="lp-ctrl lp-play" id="lpPlayBtn" aria-label="播放/暂停" title="播放/暂停">▶</button>
          <button class="lp-ctrl" id="lpNextBtn" aria-label="下一句" title="下一句">⏭</button>
          <button class="lp-ctrl lp-rate" id="lpRateBtn" aria-label="切换速度" title="切换语速">1.0x</button>
        </div>
      </footer>
    </div>

    <script src="/static/listen.js?v=20260520-listen"></script>
  </body>
</html>
