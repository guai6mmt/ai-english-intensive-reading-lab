<!doctype html>
<html lang="zh-CN" data-theme="dark" data-theme-locked="true">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#14171a" />
    <title>听力模式 · English Lab</title>
    <link rel="icon" href="/static/icons/app-icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/tokens.css?v=20260826" />
    <link rel="stylesheet" href="/static/components.css?v=20260826" />
    <link rel="stylesheet" href="/static/listen.css?v=20260828" />
    <script src="/static/theme.js?v=20260826"></script>
    <script src="/static/auth.js"></script>
  </head>
  <body>
    <div class="lp" id="lpRoot" data-stage="blind">

      <!-- ── Top bar ── -->
      <header class="lp-top">
        <button class="lp-icon" id="lpBackBtn" aria-label="返回"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg></button>
        <div class="lp-title-wrap">
          <div class="lp-title" id="lpTitle">加载中…</div>
          <div class="lp-sub" id="lpSub"></div>
        </div>
        <button class="lp-icon" id="lpRegenBtn" aria-label="重新生成" title="重新解析并生成整篇音频"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M20 11.5A8.5 8.5 0 1 1 11.5 3"/><path d="M20 4v5h-5"/></svg></button>
        <button class="lp-icon" id="lpFullscreenBtn" aria-label="全屏" title="全屏"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
      </header>

      <!-- ── Article pane (left) ── -->
      <div class="lp-article" id="lpArticle">
        <!-- Skeleton shown while sentences fetch (<1s) -->
        <div class="lp-skeleton" id="lpSkeleton">
          <div class="lp-sk-line lp-sk-w80"></div>
          <div class="lp-sk-line lp-sk-w100"></div>
          <div class="lp-sk-line lp-sk-w95"></div>
          <div class="lp-sk-line lp-sk-w60"></div>
          <div class="lp-sk-gap"></div>
          <div class="lp-sk-line lp-sk-w100"></div>
          <div class="lp-sk-line lp-sk-w88"></div>
          <div class="lp-sk-line lp-sk-w75"></div>
        </div>
      </div>

      <!-- ── Vocab pane (right, spans full height) ── -->
      <div class="lp-vocab">
        <div class="lp-stage-tabs" id="lpStageTabs" role="tablist" aria-label="精听训练阶段">
          <button data-stage="blind" aria-selected="true"><b>1</b>盲听</button>
          <button data-stage="dictation" aria-selected="false"><b>2</b>听写</button>
          <button data-stage="correction" aria-selected="false"><b>3</b>纠错</button>
          <button data-stage="shadowing" aria-selected="false"><b>4</b>跟读</button>
          <button class="lp-review-tab" id="lpReviewBtn" title="打开错句复习队列">复习 <span id="lpReviewCount">0</span></button>
        </div>
        <div class="lp-practice" id="lpPracticeBody"></div>
        <div class="lp-vocab-head">
          <span>当前句生词</span>
          <span class="lp-vocab-status" id="lpVocabStatus"></span>
        </div>
        <div class="lp-vocab-body" id="lpVocabBody">
          <div class="lp-vocab-hint">点击 ▶ 开始播放后显示生词</div>
        </div>
      </div>

      <!-- ── Bottom control bar ── -->
      <footer class="lp-controls">
        <div class="lp-source" id="lpSource" hidden></div>
        <div class="lp-drill-controls" aria-label="逐句练习设置">
          <label>每句
            <select id="lpRepeatCount" aria-label="每句播放次数">
              <option value="1">1 次</option><option value="2">2 次</option><option value="3">3 次</option><option value="5">5 次</option>
            </select>
          </label>
          <label>句间
            <select id="lpPauseDuration" aria-label="句间停顿">
              <option value="0">不停顿</option><option value="500">0.5 秒</option><option value="1000">1 秒</option><option value="2000">2 秒</option>
            </select>
          </label>
          <button id="lpLoopBtn" aria-pressed="false" title="持续循环当前句，快捷键 L">单句循环</button>
          <span class="lp-shortcuts">Space 播放 · ←/→ 切句 · R 复读 · L 循环 · 1–4 阶段</span>
        </div>
        <div class="lp-prepare" id="lpPrepare" hidden>
          <div class="lp-prepare-head">
            <span class="lp-prepare-stage" id="lpPrepareStage">准备整篇音频…</span>
            <span class="lp-prepare-meta">
              <span class="lp-prepare-elapsed" id="lpPrepareElapsed">00:00</span>
              <span class="lp-prepare-pct" id="lpPreparePct">0%</span>
            </span>
          </div>
          <div class="lp-prepare-bar"><div class="lp-prepare-fill" id="lpPrepareFill"></div></div>
          <div class="lp-prepare-msg" id="lpPrepareMsg">等待开始…</div>
        </div>
        <div class="lp-progress-wrap">
          <div class="lp-progress-bar" id="lpProgressBar">
            <div class="lp-progress-fill" id="lpProgressFill"></div>
          </div>
          <div class="lp-progress-meta">
            <span id="lpProgressIndex">—</span>
            <span class="lp-progress-sep">/</span>
            <span id="lpProgressTotal">—</span>
          </div>
        </div>
        <div class="lp-ctrl-row">
          <button class="lp-ctrl" id="lpPrevBtn" aria-label="上一句" disabled><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h2.2v14H7zM19 5v14l-9-7z"/></svg></button>
          <button class="lp-ctrl" id="lpRepeatBtn" aria-label="复读" disabled><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 8"/><path d="M20 4v4h-4"/></svg></button>
          <button class="lp-ctrl lp-play" id="lpPlayBtn" aria-label="播放/暂停" disabled><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg></button>
          <button class="lp-ctrl" id="lpNextBtn" aria-label="下一句" disabled><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17 5h-2.2v14H17zM5 5v14l9-7z"/></svg></button>
          <button class="lp-ctrl lp-rate" id="lpRateBtn" aria-label="切换速度">1.0x</button>
        </div>
      </footer>

    </div>
    <script src="/static/listen.js?v=20260828"></script>
  </body>
</html>
