<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0f1115" />
    <title>听力模式 · English Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/listen.css?v=20260522-v5" />
  </head>
  <body>
    <div class="lp" id="lpRoot">

      <!-- ── Top bar ── -->
      <header class="lp-top">
        <button class="lp-icon" id="lpBackBtn" aria-label="返回">←</button>
        <div class="lp-title-wrap">
          <div class="lp-title" id="lpTitle">加载中…</div>
          <div class="lp-sub" id="lpSub"></div>
        </div>
        <button class="lp-icon" id="lpRegenBtn" aria-label="重新生成" title="重新解析并生成整篇音频">↻</button>
        <button class="lp-icon" id="lpThemeBtn" aria-label="切换主题" title="切换主题">◐</button>
        <button class="lp-icon" id="lpFullscreenBtn" aria-label="全屏" title="全屏">⛶</button>
      </header>

      <!-- ── Main: article (left) + vocab (right) ── -->
      <section class="lp-main">

        <div class="lp-article" id="lpArticle">
          <!-- Skeleton shown while sentences fetch (<1s) -->
          <div class="lp-skeleton" id="lpSkeleton">
            <div class="lp-sk-line lp-sk-w80"></div>
            <div class="lp-sk-line lp-sk-w100"></div>
            <div class="lp-sk-line lp-sk-w95"></div>
            <div class="lp-sk-line lp-sk-w60"></div>
            <div class="lp-sk-gap"></div>
            <div class="lp-sk-line lp-sk-w100"></div>
            <div class="lp-sk-line lp-sk-w88"></div>
            <div class="lp-sk-line lp-sk-w75"></div>
          </div>
        </div>

        <div class="lp-vocab">
          <div class="lp-vocab-head">
            <span>当前句生词</span>
            <span class="lp-vocab-status" id="lpVocabStatus"></span>
          </div>
          <div class="lp-vocab-body" id="lpVocabBody">
            <div class="lp-vocab-hint">点击 ▶ 开始播放后显示生词</div>
          </div>
        </div>

      </section>

      <!-- ── Bottom control bar ── -->
      <footer class="lp-controls">
        <div class="lp-prepare" id="lpPrepare" hidden>
          <div class="lp-prepare-head">
            <span class="lp-prepare-stage" id="lpPrepareStage">准备整篇音频…</span>
            <span class="lp-prepare-meta">
              <span class="lp-prepare-elapsed" id="lpPrepareElapsed">00:00</span>
              <span class="lp-prepare-pct" id="lpPreparePct">0%</span>
            </span>
          </div>
          <div class="lp-prepare-bar"><div class="lp-prepare-fill" id="lpPrepareFill"></div></div>
          <div class="lp-prepare-msg" id="lpPrepareMsg">等待开始…</div>
        </div>
        <div class="lp-progress-wrap">
          <div class="lp-progress-bar" id="lpProgressBar">
            <div class="lp-progress-fill" id="lpProgressFill"></div>
          </div>
          <div class="lp-progress-meta">
            <span id="lpProgressIndex">—</span>
            <span class="lp-progress-sep">/</span>
            <span id="lpProgressTotal">—</span>
          </div>
        </div>
        <div class="lp-ctrl-row">
          <button class="lp-ctrl" id="lpPrevBtn"   aria-label="上一句" disabled>⏮</button>
          <button class="lp-ctrl" id="lpRepeatBtn" aria-label="复读"   disabled>↺</button>
          <button class="lp-ctrl lp-play" id="lpPlayBtn" aria-label="播放/暂停" disabled>▶</button>
          <button class="lp-ctrl" id="lpNextBtn"   aria-label="下一句" disabled>⏭</button>
          <button class="lp-ctrl lp-rate" id="lpRateBtn" aria-label="切换速度">1.0x</button>
        </div>
      </footer>

    </div>
    <script src="/static/listen.js?v=20260522-v6"></script>
  </body>
</html>
