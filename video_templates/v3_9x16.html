<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 540px;
        height: 960px;
        overflow: hidden;
        background: {{ bg }};
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      body {
        color: {{ fg }};
        font-family: {{ sans_en }};
      }
      .page {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        padding: 42px 0 32px;
        overflow: hidden;
      }
      .title-bar {
        padding: 0 34px 16px;
        border-bottom: 1px solid {{ fg }};
        margin-bottom: 24px;
      }
      .topline {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      .kicker {
        font-family: {{ sans_en }};
        font-size: 10px;
        letter-spacing: 2px;
        text-transform: uppercase;
        font-weight: 600;
        color: {{ accent }};
      }
      .counter {
        font-family: {{ sans_en }};
        font-size: 11px;
        color: {{ fg2 }};
        font-variant-numeric: tabular-nums;
        letter-spacing: 1.2px;
        font-weight: 600;
        white-space: nowrap;
      }
      .counter b { color: {{ accent }}; font-weight: 700; }
      .title {
        margin-top: 6px;
        font-family: {{ serif_en }};
        font-style: italic;
        font-size: 21px;
        line-height: 1.13;
        color: {{ fg }};
      }
      .title-cn {
        margin-left: 8px;
        font-family: {{ serif_cn }};
        font-style: normal;
        font-size: 17px;
        color: {{ fg2 }};
      }
      .sentence {
        padding: 38px 34px 0;
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .sentence-en {
        font-family: {{ serif_en }};
        font-size: {{ en_size }}px;
        line-height: {{ en_leading }};
        letter-spacing: 0;
        color: {{ fg }};
        text-wrap: pretty;
      }
      .divider {
        height: 1px;
        background: {{ rule }};
      }
      .sentence-cn {
        font-family: {{ serif_cn }};
        font-size: {{ cn_size }}px;
        line-height: {{ cn_leading }};
        letter-spacing: 0;
        color: {{ fg }};
        opacity: .88;
      }
      .vocab {
        flex: 0 0 auto;
        margin-top: 18px;
      }
      .vocab-head {
        display: flex;
        align-items: baseline;
        gap: 10px;
        padding: 0 34px;
        margin-bottom: 12px;
      }
      .vocab-head-line {
        flex: 1;
        height: 1px;
        background: {{ rule }};
      }
      .vocab-count {
        font-family: {{ sans_en }};
        font-size: 9px;
        color: {{ fg2 }};
        letter-spacing: 1px;
      }
      .vocab-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
        padding: 0 34px;
      }
      .progress-wrap {
        margin-top: 22px;
        padding: 0 34px;
      }
      .progress {
        width: 100%;
        height: 2px;
        background: {{ rule }};
        position: relative;
      }
      .progress span {
        position: absolute;
        inset: 0 auto 0 0;
        width: {{ progress_pct }}%;
        background: {{ accent }};
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="title-bar">
        <div class="topline">
          <span class="kicker">Close Reading · 精读</span>
          <span class="counter"><b>§{{ sentence_index }}</b><span style="opacity:.5"> / {{ sentence_total }}</span></span>
        </div>
        <div class="title">{{ title_en }}<span class="title-cn">· {{ title_cn }}</span></div>
      </header>
      <main class="sentence">
        <p class="sentence-en">{{ sentence_en_html }}</p>
        <div class="divider"></div>
        <p class="sentence-cn">{{ sentence_cn }}</p>
      </main>
      <section class="vocab">
        <div class="vocab-head">
          <span class="kicker">Vocabulary · 难词</span>
          <div class="vocab-head-line"></div>
          <span class="vocab-count">{{ vocab_count }} words</span>
        </div>
        <div class="vocab-grid">{{ vocab_html }}</div>
        <div class="progress-wrap"><div class="progress"><span></span></div></div>
      </section>
    </div>
  </body>
</html>
