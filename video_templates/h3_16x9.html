<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1280px;
        height: 720px;
        overflow: hidden;
        background: {{ bg }};
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      body {
        color: {{ fg }};
        font-family: {{ sans_en }};
      }
      .page {
        width: 100%;
        height: 100%;
        display: grid;
        grid-template-columns: 1fr 320px;
        grid-template-rows: auto 1fr auto;
        gap: 0 42px;
        padding: 38px 54px 30px;
        overflow: hidden;
      }
      .title-bar {
        grid-column: 1 / -1;
        grid-row: 1;
        display: flex;
        align-items: center;
        gap: 16px;
        padding-bottom: 13px;
        border-bottom: 1px solid {{ fg }};
      }
      .mark {
        width: 24px;
        height: 24px;
        flex: 0 0 auto;
        background: {{ accent }};
      }
      .kicker {
        font-family: {{ sans_en }};
        font-size: 8.5px;
        letter-spacing: 2px;
        text-transform: uppercase;
        font-weight: 600;
        color: {{ accent }};
      }
      .title {
        margin-top: 2px;
        font-family: {{ serif_en }};
        font-style: italic;
        font-weight: 500;
        font-size: 18px;
        line-height: 1.1;
        color: {{ fg }};
      }
      .title-cn {
        margin-left: 8px;
        font-family: {{ serif_cn }};
        font-style: normal;
        font-size: 15px;
        color: {{ fg2 }};
      }
      .counter {
        font-family: {{ sans_en }};
        font-size: 11px;
        color: {{ fg2 }};
        font-variant-numeric: tabular-nums;
        letter-spacing: 1.2px;
        font-weight: 600;
        white-space: nowrap;
      }
      .counter b { color: {{ accent }}; font-weight: 700; }
      .main {
        grid-column: 1;
        grid-row: 2;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: {{ main_gap }}px;
        padding: 30px 4px 0 0;
      }
      .label {
        display: block;
        margin-bottom: 8px;
        font-family: {{ sans_en }};
        font-size: 9px;
        letter-spacing: 2px;
        text-transform: uppercase;
        font-weight: 600;
        color: {{ accent }};
      }
      .sentence-en {
        font-family: {{ serif_en }};
        font-size: {{ en_size }}px;
        line-height: {{ en_leading }};
        letter-spacing: 0;
        color: {{ fg }};
        text-wrap: pretty;
      }
      .divider {
        width: 60px;
        height: 1px;
        background: {{ rule }};
      }
      .sentence-cn {
        font-family: {{ serif_cn }};
        font-size: {{ cn_size }}px;
        line-height: {{ cn_leading }};
        letter-spacing: 0;
        color: {{ fg }};
        opacity: .88;
      }
      .notes {
        grid-column: 2;
        grid-row: 2;
        min-height: 0;
        border-left: .5px solid {{ rule }};
        padding-left: 22px;
        display: flex;
        flex-direction: column;
      }
      .notes-head {
        display: flex;
        align-items: baseline;
        gap: 10px;
        margin-bottom: 12px;
      }
      .notes-head-line {
        flex: 1;
        height: 1px;
        background: {{ rule }};
      }
      .vocab-list {
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }
      .footer {
        grid-column: 1 / -1;
        grid-row: 3;
        padding-top: 14px;
      }
      .progress {
        width: 100%;
        height: 2px;
        background: {{ rule }};
        position: relative;
      }
      .progress span {
        position: absolute;
        inset: 0 auto 0 0;
        width: {{ progress_pct }}%;
        background: {{ accent }};
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="title-bar">
        <div class="mark"></div>
        <div style="flex:1;min-width:0">
          <div class="kicker">{{ kicker }}</div>
          <div class="title">{{ title_en }}<span class="title-cn">· {{ title_cn }}</span></div>
        </div>
        <div class="counter"><b>§{{ sentence_index }}</b><span style="opacity:.5"> / {{ sentence_total }}</span></div>
      </header>
      <main class="main">
        <section>
          <span class="label">EN</span>
          <p class="sentence-en">{{ sentence_en_html }}</p>
        </section>
        <div class="divider"></div>
        <section>
          <span class="label">CN · 译文</span>
          <p class="sentence-cn">{{ sentence_cn }}</p>
        </section>
      </main>
      <aside class="notes">
        <div class="notes-head">
          <span class="kicker" style="font-size:10px">Notes · 难词</span>
          <div class="notes-head-line"></div>
        </div>
        <div class="vocab-list">{{ vocab_html }}</div>
      </aside>
      <footer class="footer"><div class="progress"><span></span></div></footer>
    </div>
  </body>
</html>
